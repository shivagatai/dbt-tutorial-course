version: 2

models:
  - name: stg_ecommerce__orders
    description: "Table of 1 row per order"
    columns:
      - name: order_id
        data_type: int64
        description: ""
        tests:
          - not_null
          - unique

      - name: user_id
        data_type: int64
        description: ""
        tests:
          - not_null

      - name: status
        data_type: string
        description: ""
        tests:
          - accepted_values:
              name: unexpected_order_status
              values:
                - Processing
                - Cancelled
                - Shipped
                - Complete
                - Returned

      - name: created_at
        data_type: timestamp
        description: "when the order was created"
        tests:
          - not_null

      - name: returned_at
        data_type: timestamp
        description: "when the order was returned"
        tests:
          - not_null:
              where: "status = 'Returned'"

      - name: shipped_at
        data_type: timestamp
        description: "when the order was shipped"
        tests:
          - not_null:
              where: "delivered_at IS NOT NULL OR status = 'Shipped'"

      - name: delivered_at
        data_type: timestamp
        description: "when the order was delivered"
        tests:
          - not_null:
              where: "delivered_at IS NOT NULL OR status = 'Complete'"

      - name: num_items_ordered
        data_type: int64
        description: "Number of items in the order"
        tests:
          - not_null
