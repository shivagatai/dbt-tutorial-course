version: 2

models:
  - name: stg_ecommerce__products
    description: ""
    columns:
      - name: product_id
        data_type: int64
        description: ""
        tests:
          - not_null
          - unique

      - name: cost
        data_type: float64
        description: "How much the product cost the business to purchase"
        tests:
          - not_null

      - name: retail_price
        data_type: float64
        description: "How much the product retails for on the online store"
        tests:
          - not_null

      - name: department
        data_type: string
        description: "Whether the item is Menswear or Womenswear"
        tests:
          - not_null
          - accepted_values:
              values:
                - "Men"
                - "Women"
              # quote default to true, but this just shows how you could set it to
              #  false if you wanted to have non-string values (e.g. numbers or a TRUE/FALSE column)
              quote: true
